# ================================================================
# SQL Server 2022 — base de données GestCom
# ================================================================

services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gestcom-sqlserver
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_SA_PASSWORD}
      - MSSQL_PID=Express
    volumes:
      - sqldata:/var/opt/mssql
    networks:
      - ntw_gestcom_prod
    healthcheck:
      test: >
        /opt/mssql-tools18/bin/sqlcmd
        -S localhost -U sa -P "$${DB_SA_PASSWORD}" -No
        -Q "SELECT 1" || exit 1
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s

volumes:
  sqldata:
    name: gestcom_sqldata

networks:
  ntw_gestcom_prod:
    name: ntw_gestcom_prod
    external: true
