# ================================================================
# Infrastructure gestcom — réseau Docker uniquement
#
# Le reverse-proxy nginx-proxy et l'ACME companion sont des ressources
# GLOBALES du VPS (partagées avec les autres sites).
# Ce fichier crée uniquement le réseau applicatif ntw_gestcom_prod.
#
# Le script deploy_to_vps.ps1 (action setup-network) se charge de
# connecter le container nginx-proxy existant à ce réseau.
# ================================================================

networks:
  ntw_gestcom_prod:
    name: ntw_gestcom_prod
    driver: bridge
