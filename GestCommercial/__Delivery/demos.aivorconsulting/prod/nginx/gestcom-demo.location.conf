# ─────────────────────────────────────────────────────────────────────────────
# Bloc à ajouter dans le server{} HTTPS d'aivorconsulting.com
#
# Prérequis : l'app Blazor tourne sur 127.0.0.1:5200 (voir APP_PORT dans .env)
#             et l'app est configurée avec UsePathBase("/demos/gestionscommercial")
# ─────────────────────────────────────────────────────────────────────────────

# ── Application Blazor Server (HTTP + SignalR WebSocket) ──────────────────────
location /demos/gestionscommercial {

    proxy_pass         http://127.0.0.1:5200;
    proxy_http_version 1.1;

    # WebSocket obligatoire pour Blazor Server (SignalR hub /_blazor)
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection $connection_upgrade;

    # Headers de forwarding (UsePathBase + ForwardedHeaders les lit)
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host  $host;
    proxy_set_header   X-Forwarded-Port  $server_port;

    # Timeouts étendus : la connexion SignalR est persistante (30 min par défaut)
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
    proxy_connect_timeout 10s;

    # Désactiver le buffering pour le streaming Blazor
    proxy_buffering    off;
    proxy_cache        off;

    # Taille buffer pour les handshakes WebSocket/SSE
    proxy_buffer_size  16k;
}

# ── Assets statiques Blazor (_framework, _content, css, js) ──────────────────
# Ces fichiers sont servis via la même app mais on leur applique un cache agressif
location ~* ^/demos/gestionscommercial/(_framework|_content)/ {
    proxy_pass         http://127.0.0.1:5200;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

    # Cache côté client : les fichiers .wasm et .js ont des fingerprints
    add_header         Cache-Control "public, max-age=31536000, immutable";
    proxy_buffering    on;
    proxy_cache_valid  200 1d;
}
