# ================================================================
# Infrastructure — nginx-proxy + Let's Encrypt ACME companion
# Gère le reverse-proxy SSL pour gestioncom.tijaraflow.fr
# ================================================================

services:

  nginx-proxy:
    image: nginxproxy/nginx-proxy:1.6
    container_name: gestcom-nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certs:/etc/nginx/certs:ro
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - /var/run/docker.sock:/tmp/docker.sock:ro
    networks:
      - ntw_gestcom_prod

  acme-companion:
    image: nginxproxy/acme-companion:2.4
    container_name: gestcom-letsencrypt
    restart: unless-stopped
    depends_on:
      - nginx-proxy
    volumes_from:
      - nginx-proxy
    volumes:
      - certs:/etc/nginx/certs:rw
      - acme:/etc/acme.sh
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DEFAULT_EMAIL=${LETSENCRYPT_EMAIL}
    networks:
      - ntw_gestcom_prod

volumes:
  certs:
    name: gestcom_certs
  vhost:
    name: gestcom_vhost
  html:
    name: gestcom_html
  acme:
    name: gestcom_acme

networks:
  ntw_gestcom_prod:
    name: ntw_gestcom_prod
    driver: bridge
